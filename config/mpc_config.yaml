# Configuration parameters for AccelMPC Solver (Crazyflie 35g)
mpc:
  H: 31                   # Chân trời dự báo (Prediction horizon)
  dt: 0.002               # Thời gian lấy mẫu (Sampling time = 2ms -> 500Hz/1kHz control)
  rho: 4096.0             # ADMM penalty parameter (Tối ưu cho Full Scaling)
  tol: 1e-5               # Ngưỡng hội tụ thực tế (Cần tối ưu sau)
  max_iter: 40000         # Giới hạn vòng lặp tối đa (Cần tối ưu sau)

# Trọng số ma trận phạt trạng thái Q (12x12)
# Order: [x, y, z, roll, pitch, yaw, vx, vy, vz, wx, wy, wz]
Q_diag: [100.0, 100.0, 100.0, 4.0, 4.0, 400.0, 4.0, 4.0, 4.0, 2.0, 2.0, 4.0]

# Trọng số ma trận phạt tín hiệu điều khiển R (4x4 - Lực đẩy motor lệch)
R_diag: [4.0, 4.0, 4.0, 4.0]

# Hệ số Full Scaling
scale_x: [0.01, 0.01, 0.01, 0.5, 0.5, 0.5, 0.3, 0.3, 0.3, 20.0, 20.0, 20.0]
scale_u: [1.0, 1.0, 1.0, 1.0]